name: OpenWorkSwift
options:
  bundleIdPrefix: ai.openwork
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: "OpenWork"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    # mlx-swift Metal headers use C++17 `if constexpr`; silence dialect noise from the Metal frontend.
    OTHER_CPLUSPLUSFLAGS: "$(inherited) -std=c++17 -Wno-c++17-extensions"
    OTHER_CFLAGS: "$(inherited) -Wno-c++17-extensions"
    OTHER_METAL_FLAGS: "$(inherited) -Wno-c++17-extensions"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.0.0
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.10.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0

targets:
  OpenWorkSwift:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    scheme:
      testTargets:
        - OpenWorkSwiftTests
      gatherCoverageData: true
    dependencies:
      - package: Yams
        product: Yams
      - package: swift-sdk
        product: MCP
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOPosix
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.openwork.OpenWorkSwift
        # PRODUCT_NAME is "OpenWork" (the shipped .app name), which would otherwise make the
        # Swift module "OpenWork" too. Tests do `@testable import OpenWorkSwift`, matching the
        # SPM module, so pin the module name independently of the product name.
        PRODUCT_MODULE_NAME: OpenWorkSwift
        # The About row used to hardcode "1.0.0" while the released tag was 1.1.0. With
        # GENERATE_INFOPLIST_FILE and no MARKETING_VERSION the bundle also reported 1.0, so
        # there was no single place that knew the version. Bump these on release.
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 OpenWork. All rights reserved."
        INFOPLIST_KEY_CFBundleDisplayName: "OpenWork"
        INFOPLIST_KEY_CFBundleIconFile: "AppIcon"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        COMBINE_HIDPI_IMAGES: YES
        # Signing lives here, not in the .xcodeproj. XcodeGen rewrites that file from this spec
        # on every `xcodegen generate`, so anything set through Xcode's Signing & Capabilities
        # pane survives only until the next regeneration — and the project file is regenerated
        # whenever a source file is added.
        # A local self-signed certificate, created by Scripts/create-local-signing-cert.sh.
        #
        # This is about TCC, not distribution. Ad-hoc signing (`-`) makes macOS identify the app
        # by its binary hash, so **every rebuild silently invalidates Accessibility and Screen
        # Recording** while leaving the app ticked in System Settings: it reads "granted" and
        # behaves "denied", and the perception tools die without saying why. A stable certificate
        # makes TCC key on the certificate instead, so those grants survive rebuilds.
        #
        # It does nothing for distribution — shipping outside the App Store still needs a real
        # "Developer ID Application" certificate and notarisation. CI has no keychain, so
        # .github/workflows/ci.yml overrides this with `CODE_SIGN_IDENTITY="-"` on the command
        # line; anyone building without the local certificate can do the same.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "OpenWork Local Signing"
        OTHER_SWIFT_FLAGS: "$(inherited) -strict-concurrency=minimal"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -std=c++17 -Wno-c++17-extensions"
        OTHER_CFLAGS: "$(inherited) -Wno-c++17-extensions"
        OTHER_METAL_FLAGS: "$(inherited) -Wno-c++17-extensions"

  OpenWorkSwiftTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/OpenWorkSwiftTests
    dependencies:
      # Sets TEST_HOST/BUNDLE_LOADER so `@testable import OpenWorkSwift` resolves.
      - target: OpenWorkSwift
    settings:
      base:
        # The base settings force PRODUCT_NAME to "OpenWork" for every target; the
        # test bundle needs its own name or it collides with the app product.
        PRODUCT_NAME: "OpenWorkSwiftTests"
        PRODUCT_BUNDLE_IDENTIFIER: ai.openwork.OpenWorkSwiftTests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -strict-concurrency=minimal"
        # XcodeGen derives TEST_HOST from the target name and lands on OpenWorkSwift.app,
        # but the app ships as OpenWork.app. Point at the real product.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenWork.app/Contents/MacOS/OpenWork"
        BUNDLE_LOADER: "$(TEST_HOST)"
