name: SwiftOpenWork
options:
  bundleIdPrefix: io.github.foscoe63
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    PRODUCT_NAME: "SwiftOpenWork"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    # mlx-swift Metal headers use C++17 `if constexpr`; silence dialect noise from the Metal frontend.
    OTHER_CPLUSPLUSFLAGS: "$(inherited) -std=c++17 -Wno-c++17-extensions"
    OTHER_CFLAGS: "$(inherited) -Wno-c++17-extensions"
    # Do not add `-std=c++17` here: Xcode already passes `-std=macos-metal…`, and a second
    # `-std=` would replace the Metal dialect. The warning flag is the one that is safe.
    OTHER_METAL_FLAGS: "$(inherited) -Wno-c++17-extensions"

packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 5.0.0
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.10.0
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: 2.81.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 1.3.0

targets:
  SwiftOpenWork:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    scheme:
      testTargets:
        - SwiftOpenWorkTests
      gatherCoverageData: true
    dependencies:
      - package: Yams
        product: Yams
      - package: swift-sdk
        product: MCP
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOPosix
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        # Vision checkpoints need their own factory; MLXLLM builds a text-only pipeline that
        # silently drops images.
        product: MLXVLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        # Renamed from OpenWork / ai.openwork.OpenWorkSwift in 1.2: another app is called
        # OpenWork, and ai.openwork is its domain. LegacyIdentityMigration carries 1.1 data over.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.foscoe63.SwiftOpenWork
        # Product, module, scheme and target are all SwiftOpenWork now. The module name stays
        # pinned so a future change to PRODUCT_NAME cannot silently rename the module that
        # `@testable import SwiftOpenWork` needs.
        PRODUCT_MODULE_NAME: SwiftOpenWork
        # The About row used to hardcode "1.0.0" while the released tag was 1.1.0. With
        # GENERATE_INFOPLIST_FILE and no MARKETING_VERSION the bundle also reported 1.0, so
        # there was no single place that knew the version. Bump these on release.
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 SwiftOpenWork. All rights reserved."
        INFOPLIST_KEY_CFBundleDisplayName: "SwiftOpenWork"
        INFOPLIST_KEY_CFBundleIconFile: "AppIcon"
        # Privacy strings. macOS terminates an app that touches the microphone or speech
        # recognition without these, rather than showing a permission prompt — so the composer's
        # mic button crashed the app on first press. Apple Events covers the osascript bridge,
        # whose requests are attributed to this app.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "SwiftOpenWork listens to the microphone only while you are dictating into the composer."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "SwiftOpenWork turns your dictation into text for the composer."
        INFOPLIST_KEY_NSAppleEventsUsageDescription: "SwiftOpenWork runs AppleScript on your behalf when an agent tool or automation asks it to control another app."
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        COMBINE_HIDPI_IMAGES: YES
        # Signing lives here, not in the .xcodeproj. XcodeGen rewrites that file from this spec
        # on every `xcodegen generate`, so anything set through Xcode's Signing & Capabilities
        # pane survives only until the next regeneration — and the project file is regenerated
        # whenever a source file is added.
        # A local self-signed certificate, created by Scripts/create-local-signing-cert.sh.
        #
        # This is about TCC, not distribution. Ad-hoc signing (`-`) makes macOS identify the app
        # by its binary hash, so **every rebuild silently invalidates Accessibility and Screen
        # Recording** while leaving the app ticked in System Settings: it reads "granted" and
        # behaves "denied", and the perception tools die without saying why. A stable certificate
        # makes TCC key on the certificate instead, so those grants survive rebuilds.
        #
        # It does nothing for distribution — shipping outside the App Store still needs a real
        # "Developer ID Application" certificate and notarisation. CI has no keychain, so
        # .github/workflows/ci.yml overrides this with `CODE_SIGN_IDENTITY="-"` on the command
        # line; anyone building without the local certificate can do the same.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "SwiftOpenWork Local Signing"
        OTHER_SWIFT_FLAGS: "$(inherited) -strict-concurrency=minimal"
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -std=c++17 -Wno-c++17-extensions"
        OTHER_CFLAGS: "$(inherited) -Wno-c++17-extensions"
        OTHER_METAL_FLAGS: "$(inherited) -Wno-c++17-extensions"

  SwiftOpenWorkTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SwiftOpenWorkTests
    dependencies:
      # Sets TEST_HOST/BUNDLE_LOADER so `@testable import SwiftOpenWork` resolves.
      - target: SwiftOpenWork
    settings:
      base:
        # The base settings force PRODUCT_NAME to "SwiftOpenWork" for every target; the
        # test bundle needs its own name or it collides with the app product.
        PRODUCT_NAME: "SwiftOpenWorkTests"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.foscoe63.SwiftOpenWorkTests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_SWIFT_FLAGS: "$(inherited) -strict-concurrency=minimal"
        # XcodeGen derives TEST_HOST from the target name and lands on SwiftOpenWork.app,
        # but the app ships as SwiftOpenWork.app. Point at the real product.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwiftOpenWork.app/Contents/MacOS/SwiftOpenWork"
        BUNDLE_LOADER: "$(TEST_HOST)"
